name: Security quality gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install pinned build-time dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Rebuild and verify generated runtime models
        run: |
          npm run model:build
          npm run lexical:build
          npm run finglish-source:build
          git diff --exit-code -- language_profiles.js lexical_priors.js finglish_source_model.js

      - name: Run JavaScript syntax checks
        run: npm run check

      - name: Run deterministic security and product tests
        run: npm test

      - name: Run Persian evaluation metrics
        run: npm run eval

      - name: Run automated Chrome and Firefox acceptance
        run: |
          export FSA_CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$FSA_CHROME_EXECUTABLE"
          "$FSA_CHROME_EXECUTABLE" --version
          firefox --version
          npm run build:browsers
          npm run test:browsers

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farsi-smart-assistant-browser-acceptance
          path: artifacts/browser-acceptance/
          if-no-files-found: warn

      - name: Build deterministic release artifacts
        run: npm run build:release

      - name: Verify release artifacts
        run: npm run verify:release

      - name: Audit browser-store submission readiness
        run: npm run audit:store

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farsi-smart-assistant-release-candidate
          path: release/
          if-no-files-found: error

      - name: Upload AMO reviewer source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farsi-smart-assistant-amo-reviewer-source
          path: reviewer/
          if-no-files-found: error
